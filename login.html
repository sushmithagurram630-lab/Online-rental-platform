<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | RentEasy</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar"><a class="logo" href="index.html">🏠 RentEasy</a><nav><a href="index.html">Home</a><a href="properties.html">Properties</a></nav><a class="btn small" href="register.html">Register</a></header>
<div class="form-page">
  <form class="form-card" onsubmit="loginUser(event)">
    <h1>Welcome Back</h1><p>Login to your RentEasy account.</p>
    <label>Email</label><input id="loginEmail" type="email" required placeholder="you@example.com">
    <label>Password</label><input id="loginPassword" type="password" required placeholder="••••••••">
    <button class="btn full" type="submit">Login</button>
    <p class="center">New user? <a href="register.html">Create an account</a></p>
  </form>
</div>
<script src="script.js"></script>
</body>
</html>
