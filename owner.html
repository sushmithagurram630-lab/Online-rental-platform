<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard | RentEasy</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar"><a class="logo" href="index.html">🏠 RentEasy</a><nav><a href="index.html">Home</a><a href="properties.html">Properties</a><a class="active" href="owner.html">Owner Dashboard</a></nav><a class="btn small" href="login.html">Login</a></header>
<section class="page-banner"><h1>Owner Dashboard</h1><p>Manage your rental properties.</p></section>
<section class="section">
  <div class="dashboard">
    <div class="stat"><span>Properties</span><strong>4</strong></div>
    <div class="stat"><span>Rental Requests</span><strong>12</strong></div>
    <div class="stat"><span>Available</span><strong>3</strong></div>
  </div>
  <div class="panel">
    <h2>Add a Property</h2>
    <form onsubmit="addProperty(event)">
      <div class="two"><div><label>Property Name</label><input id="ownerProperty" required></div><div><label>Location</label><input id="ownerLocation" required></div></div>
      <div class="two"><div><label>Type</label><select id="ownerType" required><option>Apartment</option><option>House</option><option>Room</option></select></div><div><label>Monthly Rent</label><input id="ownerRent" type="number" required></div></div>
      <label>Description</label><textarea id="ownerDescription" rows="3"></textarea>
      <button class="btn" type="submit">Add Property</button>
    </form>
  </div>
  <div class="panel"><h2>Recent Rental Requests</h2>
    <div class="request"><b>Rahul Kumar</b><span>Modern Apartment · Pending</span></div>
    <div class="request"><b>Priya S</b><span>Luxury Apartment · Approved</span></div>
    <div class="request"><b>Arun M</b><span>Family House · Pending</span></div>
  </div>
</section>
<footer>© 2026 RentEasy</footer>
<script src="script.js"></script>
</body>
</html>
